{%- comment -%}
A big emoji greeting on the home page, picked fresh on every visit. Nothing is
stored on the visitor's device, so the site needs no cookie or storage notice.
The 👋 in the markup is what shows without JavaScript.
{%- endcomment -%}
<p class="greeting" role="img" aria-label="Hello">👋</p>
<script>
  (function () {
    var greetings = ['👋', '🥳', '🖖', '🫂', '✌️', '🤙', '🙌', '🫡', '🤗', '🎉', '👾', '🤖', '🫶', '🙃', '🫠', '🤌', '☕', '🧑‍🚀', '🎈', '🪩', '🛸', '🦾'];
    var el = document.querySelector('.greeting');
    if (el) el.textContent = greetings[Math.floor(Math.random() * greetings.length)];
  })();
</script>
