<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.tagline | default: site.description }}">
  {% if site.coming_soon or page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <link rel="icon" href="{{ site.author.avatar | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  {% assign bare = false %}{% if site.coming_soon and page.url == "/" %}{% assign bare = true %}{% endif %}
  {% unless bare %}{% include header.html %}{% endunless %}
  <main>
    {{ content }}
  </main>
  {% unless bare %}{% include footer.html %}{% endunless %}
</body>
</html>
