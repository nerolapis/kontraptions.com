---
layout: default
---
<article class="project">
  <header class="project-header">
    {% if page.cover %}
    <img class="project-cover {{ page.cover_style | default: 'photo' }}" src="{{ page.cover | relative_url }}" alt="{{ page.title }}">
    {% endif %}
    <div>
      <p class="kicker">{{ page.kind }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.tagline %}<p class="tagline">{{ page.tagline }}</p>{% endif %}
      {% if page.links %}
      <p class="project-links">
        {% for l in page.links %}<a href="{{ l.url }}">{{ l.label }}</a>{% endfor %}
      </p>
      {% endif %}
    </div>
  </header>

  {{ content }}

  <p class="back"><a href="{{ '/' | relative_url }}">&larr; All projects</a></p>
</article>
