title: Kontraptions
description: Apps, gadgets, and things that almost work, by Konstantin Erokhin.
url: https://kontraptions.com
baseurl: ""

# While true: the root shows a coming-soon page, every page is marked noindex,
# robots.txt blocks crawlers, and the real home page lives at /preview/.
# Set to false to launch.
coming_soon: true

markdown: kramdown

# Who runs the site. Edit the links below; leave a value empty to hide that link.
author:
  name: Konstantin Erokhin
  handle: nerolapis
  avatar: /assets/img/avatar.png
  bio: I make small apps and odd objects. This is where they end up.
  links:
    - label: GitHub
      url: https://github.com/nerolapis
    - label: Mastodon
      url: https://mastodon.social/@nerolapis
    - label: Bluesky
      url: https://bsky.app/profile/nerolapis.bsky.social
    - label: Email
      url: mailto:hello@kontraptions.com

# Every file in _projects/ becomes a page at /projects/<filename>/
# Every file in _topics/ becomes a page at /topics/<filename>/ listing the projects tagged with it
collections:
  projects:
    output: true
    permalink: /projects/:name/
  topics:
    output: true
    permalink: /topics/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: topics
    values:
      layout: topic

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - temp
